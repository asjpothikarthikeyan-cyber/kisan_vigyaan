augmentation:
  color_jitter:
    brightness: 0.15
    contrast: 0.15
    hue: 0.05
    saturation: 0.1
  horizontal_flip_prob: 0.5
  rotation_degrees: 15
  scale_range:
  - 0.9
  - 1.1
  shear_degrees: 5
  vertical_flip_prob: 0.2
dataset:
  image_size:
  - 224
  - 224
  - 3
  metadata_file: metadata/image_metadata.csv
  normalization:
    mean:
    - 0.485
    - 0.456
    - 0.406
    std:
    - 0.229
    - 0.224
    - 0.225
  processed_dir: data/processed
  raw_dir: data/raw
  split_ratios:
    test: 0.1
    train: 0.8
    validation: 0.1
  target_total_images: 10000
  test_dir: data/test
  train_dir: data/train
  val_dir: data/validation
inference:
  confidence_threshold: 0.7
  top_k: 3
model:
  backbone: efficientnet_b0
  dropout_rate: 0.3
  freeze_backbone_stage1: true
  pretrained: true
  unfreeze_layers_stage2:
  - features.6
  - features.7
  - features.8
  - classifier
  weights: DEFAULT
output_dirs:
  models: models
  reports: reports
project_name: Indian_Crop_Health_EfficientNet_Pipeline
seed: 42
training:
  batch_size: 32
  early_stopping:
    min_delta: 0.001
    monitor: val_loss
    patience: 3
  num_workers: 2
  stage1:
    epochs: 5
    learning_rate: 0.001
    optimizer: AdamW
    scheduler: CosineAnnealingLR
    weight_decay: 0.01
  stage2:
    epochs: 7
    learning_rate: 0.0001
    optimizer: AdamW
    scheduler: CosineAnnealingLR
    weight_decay: 0.01
version: 1.0.0
